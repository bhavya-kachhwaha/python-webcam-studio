name: Check Webcam Studio

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: docker build -t python-webcam-studio .
      - run: docker run --rm python-webcam-studio python -m unittest -v
      - run: |
          docker run -d --name webcam-check -p 127.0.0.1:7860:7860 python-webcam-studio
          trap 'docker logs webcam-check; docker rm -f webcam-check' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 5 http://127.0.0.1:7860/object-motion-lab/ -o /dev/null
          docker exec -i webcam-check python - <<'PY'
          import json
          import cv2
          import numpy as np
          from websockets.sync.client import connect
          modes = {'object-motion-lab': 'objects', 'gesture-voice-lab': 'hands',
                   'scene-caption-camera': 'caption', 'kinetic-silhouette': 'art'}
          jpeg = cv2.imencode('.jpg', np.full((240, 320, 3), 90, dtype=np.uint8))[1].tobytes()
          for mode, field in modes.items():
              with connect('ws://127.0.0.1:7860/ws/' + mode, origin='http://127.0.0.1:7860') as socket:
                  assert json.loads(socket.recv(timeout=60))['type'] == 'ready'
                  socket.send(jpeg)
                  result = json.loads(socket.recv(timeout=120))
                  assert result['type'] == 'result' and field in result, (mode, result.get('message'))
                  print(f'{mode}: native model produced {field}', flush=True)
          PY
