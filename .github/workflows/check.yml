name: Check Webcam Studio

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: docker build -t python-webcam-studio .
      - run: docker run --rm python-webcam-studio python -m unittest -v
      - run: |
          docker run --rm -d --name webcam-check -p 127.0.0.1:7860:7860 python-webcam-studio
          trap 'docker stop webcam-check' EXIT
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:7860/object-motion-lab/ -o /dev/null
